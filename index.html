<!DOCTYPE html>
<html>
<head>
    <title>Daksh Torul - CV</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .container {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .toolbar {
            padding: 1rem;
            background: #f5f5f5;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }
        .toolbar a {
            display: inline-block;
            padding: 10px 20px;
            background: #0077b5;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: 500;
        }
        .toolbar a:hover {
            background: #005582;
        }
        iframe {
            width: 100%;
            flex: 1;
            border: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="toolbar">
            <a href="cv.pdf" download>📄 Download CV (PDF)</a>
            <span style="margin-left: 1rem; color: #666;">👆 If PDF doesn't load, download it</span>
        </div>
        <iframe src="https://docs.google.com/viewer?url=https:daksh.torul.org/cv.pdf&embedded=true"></iframe>
    </div>
</body>
</html>
